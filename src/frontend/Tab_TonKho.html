<!-- ==========================================
     PHÂN HỆ 2: QUẢN LÝ TỒN KHO THIẾT BỊ (V4)
     Tích hợp Lọc Khoảng Thời Gian Nhập & Mốc Đọng Kho
     ========================================== -->
<div class="container-fluid p-0">
  <div class="row mb-3">
    <div class="col-md-12 d-flex justify-content-between align-items-center">
      <div>
        <h3 class="fw-bold text-dark"><i class="fa-solid fa-box-archive text-primary"></i> Quản Lý Tồn Kho Thiết Bị</h3>
        <p class="text-muted mb-0">Kiểm soát chi tiết từng máy, số ngày đọng kho, hỗ trợ chỉnh sửa thông tin máy.</p>
      </div>
      <span class="badge bg-primary fs-6 p-2" id="tk-total-badge">Tồn: 0 máy</span>
    </div>
  </div>

  <!-- BỘ LỌC ĐA NĂNG (ĐƯỢC NÂNG CẤP V4) -->
  <div class="card shadow-sm border-0 mb-3 bg-white">
    <div class="card-body">
      <!-- DÒNG 1: TÌM TỪ KHÓA, NHÓM, KHO -->
      <div class="row g-2 mb-2">
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="tk-search" class="form-control" placeholder="Gõ Serial, Model hoặc Tên máy..." oninput="filterTonKho()">
          </div>
        </div>
        <div class="col-md-3">
          <select id="tk-filter-nhom" class="form-select form-select-sm" onchange="filterTonKho()">
            <option value="">-- Tất cả nhóm hàng --</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="tk-filter-kho" class="form-select form-select-sm" onchange="filterTonKho()">
            <option value="">-- Tất cả vị trí kho --</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-sm btn-outline-secondary w-100 fw-bold" onclick="resetFiltersTonKho()"><i class="fa-solid fa-rotate-left"></i> Xóa lọc</button>
        </div>
      </div>

      <!-- DÒNG 2: LỌC KHOẢNG THỜI GIAN NHẬP KHO & MỐC ĐỌNG VỐN -->
      <div class="row g-2 align-items-center pt-2 border-top">
        <div class="col-md-2">
          <span class="small fw-bold text-muted"><i class="fa-solid fa-calendar-days me-1"></i> Ngày nhập từ:</span>
          <input type="date" id="tk-from-date" class="form-control form-control-sm" onchange="filterTonKho()">
        </div>
        <div class="col-md-2">
          <span class="small fw-bold text-muted">Đến ngày:</span>
          <input type="date" id="tk-to-date" class="form-control form-control-sm" onchange="filterTonKho()">
        </div>
        <div class="col-md-8 d-flex gap-1 align-items-end flex-wrap">
          <span class="small fw-bold text-muted me-1">Lọc nhanh mốc tồn:</span>
          <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2" onclick="filterMocTon(0, 30)">Dưới 30N</button>
          <button type="button" class="btn btn-sm btn-outline-warning text-dark py-1 px-2" onclick="filterMocTon(30, 60)">30 - 60N</button>
          <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2 fw-bold" onclick="filterMocTon(60, 9999)">🔴 Đọng &gt; 60N</button>
          <button type="button" class="btn btn-sm btn-outline-dark py-1 px-2 fw-bold" onclick="filterMocTon(90, 9999)">⚠️ Đọng &gt; 90N</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BẢNG DỮ LIỆU TỒN KHO -->
  <div class="card shadow-sm border-0 bg-white">
    <div class="table-responsive">
      <table class="table table-hover table-striped table-sm align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th width="15%">Mã Serial</th>
            <th width="15%">Model</th>
            <th width="25%">Tên hàng hóa</th>
            <th width="10%">Vị trí kho</th>
            <th width="10%">Loại hàng</th>
            <th width="10%">Ngày nhập</th>
            <th width="10%" class="text-center">Số ngày tồn</th>
            <th width="5%" class="text-center">Tác vụ</th>
          </tr>
        </thead>
        <tbody id="tk-table-body">
          <tr><td colspan="8" class="text-center text-muted py-4">Đang tải dữ liệu kho...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-light py-2 d-flex justify-content-between align-items-center">
      <small class="text-muted" id="tk-page-info">Trang 1 / 1 (0 máy)</small>
      <div class="btn-group btn-group-sm" id="tk-pagination"></div>
    </div>
  </div>
</div>
