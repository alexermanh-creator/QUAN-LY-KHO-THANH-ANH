      <div id="module-TonKho" class="app-module" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div>
            <h4 class="fw-bold mb-1"><i class="fa-solid fa-warehouse text-primary me-2"></i>Quản Lý Tồn Kho</h4>
            <p class="text-muted small mb-0">Theo dõi tồn kho theo từng Model hoặc danh sách Serial chi tiết</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div class="btn-group" role="group">
              <button type="button" class="btn btn-outline-primary active" id="btn-view-by-model" onclick="setStockViewMode('MODEL')">
                <i class="fa-solid fa-cubes-stacked me-1"></i> Theo Model / Sản phẩm
              </button>
              <button type="button" class="btn btn-outline-primary" id="btn-view-by-serial" onclick="setStockViewMode('SERIAL')">
                <i class="fa-solid fa-barcode me-1"></i> Theo Serial chi tiết
              </button>
            </div>
            <button class="btn btn-cam" onclick="openScannerModal('STOCK_LOOKUP')">
              <i class="fa-solid fa-camera me-1"></i> Quét kiểm tồn
            </button>
          </div>
        </div>

        <div class="app-card mb-3">
          <div class="app-card-body p-3">
            <div class="row g-2">
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">Kho hàng</label>
                <select id="filter-stock-kho" class="form-select form-select-sm" onchange="applyStockFilter()">
                  <option value="">-- Tất cả kho --</option>
                  <option value="Kho VP">Kho VP</option>
                  <option value="Kho Chi Nhánh">Kho Chi Nhánh</option>
                  <option value="Kho Cách Ly (Hàng lỗi)">Kho Cách Ly</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">Nhóm hàng</label>
                <select id="filter-stock-nhom" class="form-select form-select-sm" onchange="applyStockFilter()">
                  <option value="">-- Tất cả nhóm --</option>
                  <option value="Máy in">Máy in</option>
                  <option value="Máy Photocopy">Máy Photocopy</option>
                  <option value="Laptop">Laptop</option>
                  <option value="Máy Scan">Máy Scan</option>
                </select>
              </div>
              <div class="col-12 col-md-3">
                <label class="form-label small fw-semibold text-muted mb-1">Tìm Model / Tên / Serial</label>
                <input type="text" id="filter-stock-keyword" class="form-control form-select-sm" placeholder="Nhập từ khóa tìm..." oninput="applyStockFilter()">
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">Tuổi tồn kho</label>
                <select id="filter-stock-aging" class="form-select form-select-sm" onchange="applyStockFilter()">
                  <option value="">-- Tất cả thời gian --</option>
                  <option value="30">Tồn > 30 ngày</option>
                  <option value="45">Tồn > 45 ngày</option>
                  <option value="60">Tồn > 60 ngày</option>
                  <option value="90">Tồn > 90 ngày</option>
                  <option value="120">Tồn > 120 ngày</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">Trạng thái</label>
                <select id="filter-stock-status" class="form-select form-select-sm" onchange="applyStockFilter()">
                  <option value="IN_STOCK">Chỉ máy Còn Tồn (IN_STOCK)</option>
                  <option value="ALL">Tất cả trạng thái</option>
                  <option value="SOLD">Đã xuất bán (SOLD)</option>
                  <option value="IN_WARRANTY">Đang bảo hành</option>
                  <option value="CANCELLED_IMPORT">Hủy nhập (CANCELLED)</option>
                </select>
              </div>
              <div class="col-12 col-md-1 d-flex align-items-end">
                <button class="btn btn-sm btn-outline-secondary w-100" onclick="resetStockFilter()">
                  <i class="fa-solid fa-rotate-left"></i> Xóa
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="stock-view-model-container">
          <div class="app-card">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 table-responsive-card">
                <thead class="table-light">
                  <tr>
                    <th>Model</th>
                    <th>Tên Sản Phẩm</th>
                    <th>Hãng & Nhóm</th>
                    <th class="text-center">Kho VP</th>
                    <th class="text-center">Kho CN</th>
                    <th class="text-center">Kho Cách Ly</th>
                    <th class="text-center fw-bold">Tổng Tồn</th>
                    <th class="text-end">Hành động</th>
                  </tr>
                </thead>
                <tbody id="stock-model-table-body">
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="stock-view-serial-container" style="display: none;">
          <div class="app-card">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 table-responsive-card">
                <thead class="table-light">
                  <tr>
                    <th>Serial Hãng (Mfg SN)</th>
                    <th>Mã Nội Bộ Thành An</th>
                    <th>Model</th>
                    <th>Kho</th>
                    <th>Ngày Nhập</th>
                    <th>Tuổi Tồn</th>
                    <th>Trạng Thái</th>
                    <th class="text-end">Thao Tác</th>
                  </tr>
                </thead>
                <tbody id="stock-serial-table-body">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
